<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Catch cross-origin script errors generated by external iframes/ad networks before they bubble
      window.addEventListener('error', function(e) {
        if (e && (e.message === 'Script error.' || !e.filename)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
    <title>SkyLah — Singapore 2-Hour Weather Forecast</title>
    <meta name="description" content="Singapore weather forecast app displaying official 2-hour forecasts from data.gov.sg across neighbourhoods." />
    <meta property="og:title" content="SkyLah — Singapore 2-Hour Weather Forecast" />
    <meta property="og:description" content="Singapore weather forecast app displaying official 2-hour forecasts from data.gov.sg across neighbourhoods." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
